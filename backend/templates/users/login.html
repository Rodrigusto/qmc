<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Hamburgueria</title>
{% load static %}
<link rel="stylesheet" href="{% static 'css/main.css' %}">
<style>
body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1a18;
}
.login-box {
    background: #fff;
    border-radius: 12px;
    padding: 2.5rem 2rem;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 8px 32px rgba(0,0,0,.3);
}
.login-brand {
    text-align: center;
    margin-bottom: 2rem;
}
.login-brand .emoji {
    font-size: 2.5rem;
    display: block;
    margin-bottom: .5rem;
}
.login-brand h1 {
    font-size: 1.2rem;
    font-weight: 700;
    color: #1a1a18;
}
.login-brand p {
    font-size: .85rem;
    color: #888;
    margin-top: .25rem;
}
.login-box .btn-primary {
    width: 100%;
    justify-content: center;
    padding: 10px;
    font-size: .95rem;
}
.error-msg {
    background: #fcebeb;
    color: #a32d2d;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: .875rem;
    margin-bottom: 1rem;
}
</style>
</head>
<body>

<div class="login-box">
<div class="login-brand">
<span class="emoji">🍔</span>
<h1>Gestor de Custos</h1>
<p>Entre com sua conta para continuar</p>
</div>

{% if messages %}
{% for msg in messages %}
    <div class="error-msg">{{ msg }}</div>
{% endfor %}
{% endif %}

<form method="post">
{% csrf_token %}

<div class="form-group">
    <label for="username">Usuário</label>
    <input
    type="text"
    id="username"
    name="username"
    placeholder="seu usuário"
    autofocus
    autocomplete="username"
    required
    >
</div>

<div class="form-group">
    <label for="password">Senha</label>
    <div style="position:relative;">
    <input
        type="password"
        id="password"
        name="password"
        placeholder="••••••••"
        autocomplete="current-password"
        required
        style="padding-right: 2.5rem;"
    >
    <button
        type="button"
        onclick="togglePassword()"
        style="position:absolute; right:10px; top:50%; transform:translateY(-50%);
                background:none; border:none; cursor:pointer; color:#888; font-size:.9rem;"
        title="Mostrar senha">
        👁
    </button>
    </div>
</div>

<button type="submit" class="btn btn-primary" style="margin-top:.5rem;">
    Entrar
</button>
</form>
</div>

<script>
function togglePassword() {
const input = document.getElementById('password');
input.type = input.type === 'password' ? 'text' : 'password';
}
</script>

</body>
</html>
