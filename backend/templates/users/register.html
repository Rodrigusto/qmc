<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Hamburgueria</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a18;
    }
    .register-box {
      background: #fff;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,.3);
    }
    .register-brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .register-brand .emoji {
      font-size: 2.5rem;
      display: block;
      margin-bottom: .5rem;
    }
    .register-brand h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #1a1a18;
    }
    .register-brand p {
      font-size: .85rem;
      color: #888;
      margin-top: .25rem;
    }
    .btn-primary {
      width: 100%;
      justify-content: center;
      padding: 10px;
      font-size: .95rem;
    }
    .login-link {
      text-align: center;
      margin-top: 1.25rem;
      font-size: .875rem;
      color: #888;
    }
    .login-link a {
      color: #f5a623;
      text-decoration: none;
      font-weight: 500;
    }
    .error-msg {
      background: #fcebeb;
      color: #a32d2d;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: .875rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

<div class="register-box">
  <div class="register-brand">
    <span class="emoji">🍔</span>
    <h1>Criar sua conta</h1>
    <p>Gerencie os custos da sua hamburgueria</p>
  </div>

  {% if messages %}
    {% for msg in messages %}
      <div class="error-msg">{{ msg }}</div>
    {% endfor %}
  {% endif %}

  <form method="post">
    {% csrf_token %}

    <div class="form-group">
      <label for="first_name">Seu nome</label>
      <input
        type="text"
        id="first_name"
        name="first_name"
        placeholder="Como prefere ser chamado"
        value="{{ request.POST.first_name }}"
        autofocus
      >
    </div>

    <div class="form-group">
      <label for="username">Usuário *</label>
      <input
        type="text"
        id="username"
        name="username"
        placeholder="sem espaços ou caracteres especiais"
        value="{{ request.POST.username }}"
        required
      >
    </div>

    <div class="form-group">
      <label for="email">E-mail</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="seu@email.com"
        value="{{ request.POST.email }}"
      >
    </div>

    <div class="form-group">
      <label for="password1">Senha *</label>
      <input
        type="password"
        id="password1"
        name="password1"
        placeholder="mínimo 6 caracteres"
        required
      >
    </div>

    <div class="form-group">
      <label for="password2">Confirme a senha *</label>
      <input
        type="password"
        id="password2"
        name="password2"
        placeholder="repita a senha"
        required
      >
    </div>

    <button type="submit" class="btn btn-primary" style="margin-top:.5rem;">
      Criar conta
    </button>
  </form>

  <div class="login-link">
    Já tem conta? <a href="{% url 'users:login' %}">Entrar</a>
  </div>
</div>

</body>
</html>
