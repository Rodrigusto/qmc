{% extends 'base.html' %}
{% block title %}Custos Fixos{% endblock %}
{% block page_title %}Custos Fixos{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Custos Fixos</h1>
</div>

<div class="card" style="margin-bottom:1rem;">
  {% include 'calculations/partials/_fixed_cost_form.html' %}
</div>

<div class="card" style="padding:0; overflow:hidden;">
  {% include 'calculations/partials/_fixed_cost_table.html' %}
</div>

<script>
function editFixedCost(pk, name, category, amount) {
  document.getElementById('edit-pk').value              = pk;
  document.querySelector('[name="name"]').value         = name;
  document.querySelector('[name="category"]').value     = category;
  document.querySelector('[name="monthly_amount"]').value = amount;
  document.querySelector('[name="name"]').focus();
}

function resetFixedCostForm() {
  document.getElementById('edit-pk').value              = '';
  document.querySelector('[name="name"]').value         = '';
  document.querySelector('[name="category"]').value     = '';
  document.querySelector('[name="monthly_amount"]').value = '';
}
</script>
{% endblock %}
