<div id="expense-table">
  {% if expenses %}
  <table>
    <thead>
      <tr>
        <th>Nome</th>
        <th>Data</th>
        <th>Valor</th>
        <th>Observação</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for expense in expenses %}
      <tr>
        <td><strong>{{ expense.name }}</strong></td>
        <td>{{ expense.date|date:"d/m/Y" }}</td>
        <td>R$ {{ expense.amount|floatformat:2 }}</td>
        <td style="color:#888;">{{ expense.note|default:"—" }}</td>
        <td style="display:flex; gap:.5rem;">
          <button class="btn btn-outline btn-sm"
                  onclick="editExpense('{{ expense.pk }}','{{ expense.name }}','{{ expense.amount }}','{{ expense.date|date:"Y-m-d" }}','{{ expense.note }}')">
            Editar
          </button>
          <button class="btn btn-danger btn-sm"
                  hx-post="{% url 'calculations:expense_delete' expense.pk %}"
                  hx-target="#expense-table"
                  hx-swap="outerHTML"
                  hx-confirm="Remover {{ expense.name }}?">
            Remover
          </button>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
  <div style="text-align:center; padding:2rem; color:#888;">
    Nenhuma despesa cadastrada ainda.
  </div>
  {% endif %}
</div>
